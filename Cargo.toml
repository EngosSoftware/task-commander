[package]
name = "task-commander"
version = "0.0.1"
authors = ["Dariusz Depta <depta@engos.de>"]
description = "TaskCommander"
documentation = "https://docs.rs/task-commander"
repository = "https://github.com/EngosSoftware/task-commander.git"
keywords = ["task", "commander"]
homepage = "https://engossoftware.github.io/task-commander/"
categories = ["command-line-utilities"]
edition = "2024"
license = "MIT OR Apache-2.0"
include = [
    "src/**",
    "tests/**",
    "docs/*.rs.md",
    "Cargo.lock",
    "Cargo.toml",
    "LICENSE*",
    "README.md"
]

[dependencies]
antex = "0.2.3"
diml = "0.2.0"
petgraph = "0.8.3"

[dev-dependencies]
cli-assert = "0.1.13"
